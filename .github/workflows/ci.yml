name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: soundscape

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: soundscape/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: soundscape/.node-version
          cache: pnpm
          cache-dependency-path: soundscape/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo build respects the workspace dependency graph (dependsOn ^build),
      # so shared packages (types/utils/ui) are built before web/api. Building
      # web directly fails to resolve @soundscape/utils' dist otherwise.
      - name: Build workspace and Cloudflare Worker
        run: pnpm build:cloudflare

      - name: Test API, database, broker and web
        run: pnpm test

      - name: Check Worker and database types
        run: |
          pnpm --filter @soundscape/server build
          pnpm --filter @soundscape/scrapes-db type-check

      - name: Deploy built Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: soundscape/apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || "$CLOUDFLARE_API_TOKEN" == *[[:space:]]* ]]; then
            echo "CLOUDFLARE_API_TOKEN must be a bare token without whitespace" >&2
            exit 1
          fi
          pnpm exec cf deploy --prebuilt --provision=false
