name: Release

# Builds a universal (Apple Silicon + Intel) .app and publishes it to GitHub Releases.
#
#   • push to main      → updates a single rolling "latest" prerelease (always-current download)
#   • push a vX.Y.Z tag → cuts a permanent, numbered release
#
# The .app is ad-hoc signed (not Developer-ID signed/notarized), so downloaders must
# clear Gatekeeper once — see the release notes / README.

on:
  push:
    branches: [main]
    tags: ['v*']

# Allow the job to create releases and move the `latest` tag.
permissions:
  contents: write

# A newer push to main supersedes an in-flight one; tag builds run to completion.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    runs-on: macos-14   # has full Xcode, required for the universal cross-build
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app
        run: UNIVERSAL=1 ./build-app.sh

      - name: Verify the binary is universal
        run: |
          BIN="build/RYM MenuBar.app/Contents/MacOS/RYMMenuBar"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64" && lipo -info "$BIN" | grep -q "arm64" \
            || { echo "::error::binary is not universal"; exit 1; }

      - name: Package the .app into a zip
        run: |
          cd build
          # ditto preserves the bundle + signature correctly (plain `zip` can mangle it).
          ditto -c -k --keepParent "RYM MenuBar.app" "RYM-MenuBar.zip"

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME"               >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME"               >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                    >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                          >> "$GITHUB_OUTPUT"
            echo "name=Latest build (main)"            >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                     >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: build/RYM-MenuBar.zip
          fail_on_unmatched_files: true
          body: |
            Universal macOS build (Apple Silicon + Intel).

            **Install**
            1. Download `RYM-MenuBar.zip` below and unzip it.
            2. Move `RYM MenuBar.app` to `/Applications`.
            3. First launch: right-click the app → **Open** → **Open** (the app is
               ad-hoc signed, not notarized, so Gatekeeper warns once). Or run:
               `xattr -dr com.apple.quarantine "/Applications/RYM MenuBar.app"`.

            See the README for how to point it at a debug Chrome (the app can launch
            one for you from its menu).
