# Nixpacks configuration for Railway
# This is a generic config - services should use their own nixpacks.toml
# This file is kept for backward compatibility but should not be used
# Each service (server, web) has its own nixpacks.toml in their directories
# 
# NOTE: If Railway uses this file, it will skip install (services handle it in build scripts)

[phases.setup]
nixPkgs = ["nodejs_18", "pnpm", "openssl"]

# Skip install - services handle it in their build scripts with --no-frozen-lockfile
# Railway's auto-install runs before nixpacks, so we can't prevent it here
# Services must handle installation in their build scripts
[phases.install]
cmds = []

