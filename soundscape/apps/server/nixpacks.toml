# Nixpacks configuration for Railway server service
# This tells Railway to use pnpm instead of npm

[phases.setup]
nixPkgs = ["nodejs_18", "pnpm", "openssl"]

# Skip install phase - let the build script handle it
# This ensures all workspace packages are available before installation
[phases.install]
cmds = []

[phases.build]
cmds = ["bash /app/apps/server/railway-build.sh"]

[phases.start]
cmd = "cd /app && pnpm --filter @soundscape/server start"

