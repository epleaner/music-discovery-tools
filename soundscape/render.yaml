services:
  # PostgreSQL Database
  - type: pspg
    name: soundscape-db
    plan: starter
    databaseName: soundscape
    user: soundscape

  # Backend API Server
  - type: web
    name: soundscape-api
    env: node
    plan: starter
    buildCommand: ./apps/server/render-build.sh
    startCommand: pnpm --filter @soundscape/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soundscape-db
          property: connectionString
      - key: API_BASE_URL
        fromService:
          type: web
          name: soundscape-api
          property: host
        transform: https://${host}
      - key: WEB_APP_URL
        fromService:
          type: web
          name: soundscape-web
          property: host
        transform: https://${host}
      - key: PORT
        fromService:
          type: web
          name: soundscape-api
          property: port

  # Web App (Static Site)
  - type: web
    name: soundscape-web
    env: static
    installCommand: pnpm install --no-frozen-lockfile --ignore-scripts
    buildCommand: ./apps/web/render-build.sh
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soundscape-api
          property: host
        transform: https://${host}
      - key: VITE_WS_URL
        fromService:
          type: web
          name: soundscape-api
          property: host
        transform: wss://${host}/ws
      - key: VITE_LASTFM_API_KEY
        sync: false  # Set this manually in Render dashboard

